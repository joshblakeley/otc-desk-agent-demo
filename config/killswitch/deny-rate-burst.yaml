# Kill-switch policy: trip the agent's kill switch automatically when its
# data-policy deny rate spikes.
#
# What counts as a deny: a request refused because it asks outside the bounds
# of a person, for example a clamp violated when the broker asks for more than
# 25 rows. A healthy assistant rarely does this. A burst means that something
# pushes at the limits, such as a manipulated prompt. Contain the agent first,
# then investigate. A response withheld because a rule cannot apply is an
# evaluation error instead. See policy-error-burst.yaml.
#
# How it decides: the detector counts calls in 5-minute windows, fixed for the
# whole fleet. A window with fewer than 10 calls never fires. BURST fires when
# the lower bound of the deny rate in a window, at the stated confidence, is
# above the threshold. The evaluation-error policy uses the same detector. In a
# rehearsal of it, 24 errors in 24 calls gave a statistic of 0.749 against a
# threshold of 0.2 (measured, 2026-10-05, with `make drill`).
#
# Mode, the rollout ladder:
#   SHADOW   evaluate and record a firing, nothing else (start here)
#   WARN     also notify
#   ENFORCE  also engage the agent's kill switch: MCP, LLM and agent-to-agent
#            traffic for this agent stops until a person releases it
# KILLSWITCH_MODE in env/<env>.env overrides the mode below at apply time.
#
# There is no `rpai apply` for this resource yet. scripts/07-killswitch.sh
# reconciles it through the API.

name: deny-rate-burst
display_name: Data-policy deny spike
spec:
  signal: KILL_SWITCH_POLICY_SIGNAL_DATAPOLICY_DENY_RATE
  burst:
    threshold: 0.2
    confidence: BURST_CONFIDENCE_95
  mode: KILL_SWITCH_POLICY_MODE_SHADOW
